name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The M2 recording is checked against its sources at the commit it
          # was made (DESIGN.md amendment 19), which needs the history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Everything runs, and nothing here needs PyTorch: the golden files it
      # produced offline are committed. The suite checks them three ways: the
      # case file must be exactly what the code generates today (so the
      # goldens cannot go stale silently), the interpreter and autodiff must
      # match them within the budget in DESIGN.md, and
      # golden/measurements.json -- the report's only data -- must be exactly
      # what tools/measure.js recomputes, which takes a few minutes.
      - run: node --test
